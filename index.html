<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tsuku723.github.io</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 64px 24px 64px;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 32px;
    }
    .link-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .link-item {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #fff;
    }
    .link-item a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      text-decoration: none;
      color: #1a1a1a;
      font-size: 16px;
    }
    .link-item a:hover { background: #f8f8f8; border-radius: 8px; }
    .arrow { color: #bbb; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Apps</h1>
    <ul class="link-list">
      <li class="link-item">
        <a href="/little-baby-log/">
          <span>リトルベビーログ</span>
          <span class="arrow">›</span>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
