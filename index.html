<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tsuku723.github.io</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: "M PLUS Rounded 1c", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: linear-gradient(160deg, #fff1f5 0%, #fff8f0 45%, #f0f7ff 100%);
      color: #5a4a4a;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 72px 24px 64px;
      text-align: center;
    }
    .emoji {
      font-size: 40px;
      margin: 0 0 12px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 40px;
      color: #d98ca3;
      letter-spacing: 0.05em;
    }
    .link-list {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
    }
    .link-item {
      border: none;
      border-radius: 20px;
      margin-bottom: 14px;
      background: #ffffff;
      box-shadow: 0 6px 16px rgba(217, 140, 163, 0.15);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .link-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(217, 140, 163, 0.22);
    }
    .link-item a {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 22px;
      text-decoration: none;
      color: #5a4a4a;
      font-size: 16px;
      font-weight: 700;
    }
    .link-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .link-text {
      flex: 1;
    }
    .arrow {
      color: #f0b4c4;
      font-size: 18px;
    }
    footer {
      margin-top: 56px;
      font-size: 12px;
      color: #c9b8b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="emoji">🍼✨</p>
    <h1>Teeda Studio Apps</h1>
    <ul class="link-list">
      <li class="link-item">
        <a href="/little-baby-log/">
          <img class="link-icon" src="/assets/little-baby-log-icon.png" alt="リトルベビーログ">
          <span class="link-text">リトルベビーログ</span>
          <span class="arrow">›</span>
        </a>
      </li>
    </ul>
    <footer>© 2026 Teeda Studio</footer>
  </div>
</body>
</html>
