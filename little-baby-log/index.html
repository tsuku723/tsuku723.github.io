<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リトルベビーログ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: "M PLUS Rounded 1c", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: linear-gradient(160deg, #eaf7f0 0%, #fff8f0 45%, #eef8f6 100%);
      color: #4a5a52;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 72px 24px 64px;
      text-align: center;
    }
    .app-icon {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 8px 20px rgba(95, 168, 143, 0.25);
      margin: 0 0 20px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 8px;
      color: #5fa88f;
      letter-spacing: 0.05em;
    }
    .tagline {
      font-size: 14px;
      color: #7f9488;
      margin: 0 0 40px;
      line-height: 1.6;
    }
    .link-list {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
    }
    .link-item {
      border: none;
      border-radius: 20px;
      margin-bottom: 14px;
      background: #ffffff;
      box-shadow: 0 6px 16px rgba(95, 168, 143, 0.15);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .link-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(95, 168, 143, 0.22);
    }
    .link-item a {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 22px;
      text-decoration: none;
      color: #4a5a52;
      font-size: 16px;
      font-weight: 700;
    }
    .link-icon {
      font-size: 22px;
    }
    .link-text {
      flex: 1;
    }
    .arrow {
      color: #a8d8c0;
      font-size: 18px;
    }
    footer {
      margin-top: 56px;
      font-size: 12px;
      color: #aebfb6;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="app-icon" src="../assets/little-baby-log-icon.png" alt="リトルベビーログ">
    <h1>リトルベビーログ</h1>
    <p class="tagline">早産・NICU経験のある赤ちゃんの成長を記録するアプリ</p>

    <ul class="link-list">
      <li class="link-item">
        <a href="about/index.html">
          <span class="link-icon">📄</span>
          <span class="link-text">このアプリについて</span>
          <span class="arrow">›</span>
        </a>
      </li>
      <li class="link-item">
        <a href="terms/index.html">
          <span class="link-icon">📜</span>
          <span class="link-text">利用規約</span>
          <span class="arrow">›</span>
        </a>
      </li>
      <li class="link-item">
        <a href="privacy-policy/index.html">
          <span class="link-icon">🔒</span>
          <span class="link-text">プライバシーポリシー</span>
          <span class="arrow">›</span>
        </a>
      </li>
      <li class="link-item">
        <a href="oss-licenses/index.html">
          <span class="link-icon">🧩</span>
          <span class="link-text">オープンソースライセンス</span>
          <span class="arrow">›</span>
        </a>
      </li>
    </ul>

    <footer>© 2026 Teeda Studio</footer>
  </div>
</body>
</html>
